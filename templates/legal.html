<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} | Rishi Bharadwaj Quantum Academy (RBQA)</title>
<meta name="description" content="{{ title }} of Rishi Bharadwaj Quantum Academy (RBQA).">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] },
  colors: { navy: { 900:'#0a192f', 800:'#112240', 700:'#233554' } } } } }
</script>
<style>
  body { background:#0a192f; color:#ccd6f6; }
  h1, h2 { color:#e6f1ff; }
  .accent { color:#64ffda; }
</style>
</head>
<body class="font-sans antialiased min-h-screen">
  <header class="border-b border-slate-800">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <i class="fa-solid fa-atom accent text-2xl"></i>
        <span class="font-bold text-white">RBQA</span>
      </a>
      <a href="/" class="text-sm text-slate-400 hover:text-white">&larr; Back to website</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-12">
    <h1 class="text-3xl md:text-4xl font-bold mb-2">{{ title }}</h1>
    <div class="w-20 h-1 bg-[#64ffda] rounded mb-10"></div>

    {% for heading, text in sections %}
    <section class="mb-8">
      <h2 class="text-lg font-semibold mb-2">{{ heading }}</h2>
      <p class="text-slate-400 leading-relaxed">{{ text }}</p>
    </section>
    {% endfor %}

    <p class="text-slate-400 mt-10">Questions? Write to
      <a class="accent hover:underline" href="mailto:{{ email }}">{{ email }}</a>.</p>

    <nav class="mt-10 pt-6 border-t border-slate-800 flex flex-wrap gap-x-6 gap-y-2 text-sm text-slate-400">
      <a class="hover:text-[#64ffda]" href="/privacy">Privacy Policy</a>
      <a class="hover:text-[#64ffda]" href="/terms">Terms &amp; Conditions</a>
      <a class="hover:text-[#64ffda]" href="/refund">Refund &amp; Cancellation Policy</a>
    </nav>
  </main>
</body>
</html>
